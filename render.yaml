services:
  # Web Service for Express Backend
  - type: web
    name: office-expanse-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: office-expanse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

databases:
  - name: office-expanse-db
    databaseName: office_expanse
    user: office_user
    region: oregon
    plan: free
